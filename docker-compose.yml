services:
  vayu-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vayu-it-solutions-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - vayu-network

networks:
  vayu-network:
    driver: bridge
